# Keeps the SHA-pinned GitHub Actions in .github/workflows up to date. npm dependencies are handled
# by .github/workflows/weekly-deps.yml (same-major, >= 7 days old, full CI before the PR opens).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
